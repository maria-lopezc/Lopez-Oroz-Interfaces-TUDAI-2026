<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home · SparkGames</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/home.css">
</head>
<body>
    <div class="loader" role="progressbar" aria-label="Cargando SparkGames" aria-live="polite">
      <div class="loader__circle">
        <img class="loader__logo" src="../img/Logo completo.png" alt="SparkGames">
      </div>
      <div class="loader__percent"></div>
      <div class="loader__bar"><div class="loader__bar-fill"></div></div>
    </div>

    <div class="navbar-contenedor">
      <iframe class="navbar-iframe" src="navbar.html" title="Barra de navegación" scrolling="no"></iframe>
    </div>
    <script src="../js/navbar-iframe.js"></script>

    <div class="bodyHome">
        <!-- ========== CARRUSEL PRINCIPAL ========== -->
        <div class="destacado">
            <p class="etiqueta etiquetaMain">Destacados</p>
            <div class="carrusel-principal">
                <button class="flecha carrusel-principal__flecha" id="principalAnterior" type="button" aria-label="Anterior">
                    <img src="../img/icons/flecha_izq.svg" alt="">
                </button>
                <div class="carrusel-principal__ventana">
                    <div class="carrusel-principal__pista">
                        <a class="card card--destacado" href="ejecutar.html"><img src="../img/peg_solitaire.png" alt="Peg Solitaire Los Simpsons"></a>
                        <a class="card card--destacado" href="#"><img src="../img/domino.png" alt="Dominó"></a>
                        <a class="card card--destacado" href="#"><img src="../img/bejeweled.png" alt="Bejeweled"></a>
                    </div>
                </div>
                <button class="flecha carrusel-principal__flecha" id="principalSiguiente" type="button" aria-label="Siguiente">
                    <img src="../img/icons/flecha_der.svg" alt="">
                </button>
            </div>
            <div class="indicadores">
                <button class="indicador indicador--activo" type="button" aria-label="Juego 1"></button>
                <button class="indicador" type="button" aria-label="Juego 2"></button>
                <button class="indicador" type="button" aria-label="Juego 3"></button>
            </div>
        </div>

        <!-- ========== CARRUSELES CHICOS ========== -->
        <p class="etiqueta etiqueta2da">Top en Ventas</p>
        <div class="fila">
            <button class="flecha fila__flecha fila__flecha--izq" type="button" aria-label="Anterior"><img src="../img/icons/flecha_izq.svg" alt=""></button>
            <div class="carrusel">
                <a class="card card--compra" href="#"><img src="../img/img_r1.png" alt=""><span class="precio">$1.99</span></a>
                <a class="card card--compra" href="#"><img src="../img/img_r2.png" alt=""><span class="precio">$0.99</span></a>
                <a class="card card--compra" href="#"><img src="../img/img_r3.png" alt=""><span class="precio">$1.49</span></a>
                <a class="card card--compra" href="#"><img src="../img/img_r4.png" alt=""><span class="precio">$2.99</span></a>
                <a class="card card--compra" href="#"><img src="../img/img_r5.png" alt=""><span class="precio">$0.49</span></a>
                <a class="card card--compra" href="#"><img src="../img/img_r6.png" alt=""><span class="precio">$1.99</span></a>
                <a class="card card--compra" href="#"><img src="../img/img_r7.png" alt=""><span class="precio">$4.99</span></a>
            </div>
            <button class="flecha fila__flecha fila__flecha--der" type="button" aria-label="Siguiente"><img src="../img/icons/flecha_der.svg" alt=""></button>
        </div>

        <p class="etiqueta etiqueta3ra">Top gratis</p>
        <div class="fila">
            <button class="flecha fila__flecha fila__flecha--izq" type="button" aria-label="Anterior"><img src="../img/icons/flecha_izq.svg" alt=""></button>
            <div class="carrusel">
                <a class="card" href="#"><img src="../img/img_m1.png" alt=""></a>
                <a class="card" href="#"><img src="../img/img_m2.png" alt=""></a>
                <a class="card" href="#"><img src="../img/img_m4.png" alt=""></a>

        </div>
        <img class="fillScreen" src="../img/publi_5.png" alt="">

        <div class="fila">
            <button class="flecha fila__flecha fila__flecha--izq" type="button" aria-label="Anterior"><img src="../img/icons/flecha_izq.svg" alt=""></button>
            <div class="carrusel">

        <div class="fila">
            <button class="flecha fila__flecha fila__flecha--izq" type="button" aria-label="Anterior"><img src="../img/icons/flecha_izq.svg" alt=""></button>
            <div class="carrusel">
                <a class="card" href="#"><img src="../img/img_c1.png" alt=""></a>
                <a class="card" href="#"><img src="../img/img_c2.png" alt=""></a>
                <a class="card" href="#"><img src="../img/img_c3.png" alt=""></a>
                <a class="card" href="#"><img src="../img/img_c4.png" alt=""></a>
                <a class="card" href="#"><img src="../img/img_c5.png" alt=""></a>
