<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">BLOCKA — portada de videojuego</title>
<desc id="desc">Portada colorida en estilo voxel con el título BLOCKA y un tablero de rompecabezas formado por piezas giratorias sobre una isla pixelada.</desc>
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#1bb8ff"/><stop offset=".62" stop-color="#82e5ff"/><stop offset="1" stop-color="#d4f7ff"/></linearGradient>
  <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff36b"/><stop offset=".45" stop-color="#ffc928"/><stop offset="1" stop-color="#f07816"/></linearGradient>
  <linearGradient id="board" x2="0" y2="1"><stop stop-color="#ffe75b"/><stop offset="1" stop-color="#f39a13"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#38e0f6"/><stop offset="1" stop-color="#087cc9"/></linearGradient>
  <pattern id="pixels" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#ffffff" opacity=".05"/><rect x="32" y="32" width="32" height="32" fill="#072d73" opacity=".04"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="16"/><feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".8"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sceneClip"><rect x="0" y="0" width="1600" height="900" rx="18"/></clipPath>
  <clipPath id="boardClip"><rect x="490" y="328" width="620" height="420" rx="14"/></clipPath>
</defs>
<g clip-path="url(#sceneClip)">
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#pixels)"/>
