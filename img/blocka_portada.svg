    <g transform="rotate(14 1380 525)"><rect x="1275" y="460" width="220" height="130" rx="13" fill="#f8f8f5"/><rect x="1287" y="472" width="196" height="106" rx="5" fill="#43c9ef"/><path d="M1287 535h196v43h-196z" fill="#4ac94a"/><rect x="1350" y="510" width="35" height="30" fill="#e53c40"/><rect x="1385" y="525" width="45" height="30" fill="#ffd19b"/></g>
