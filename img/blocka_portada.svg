    <text x="800" y="230" text-anchor="middle" font-family="Trebuchet MS, Arial Black, sans-serif" font-size="172" font-weight="1000" letter-spacing="4" fill="#321c20" stroke="#321c20" stroke-width="28" stroke-linejoin="round">BLOCKA</text>
    <text x="800" y="218" text-anchor="middle" font-family="Trebuchet MS, Arial Black, sans-serif" font-size="172" font-weight="1000" letter-spacing="4" fill="url(#gold)" stroke="#fff4a3" stroke-width="5" paint-order="stroke fill">BLOCKA</text>
