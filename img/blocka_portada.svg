    <g transform="rotate(-12 1375 730)"><rect x="1260" y="670" width="230" height="130" rx="12" fill="#f7f7f3"/><rect x="1272" y="682" width="206" height="106" fill="#12bce9"/><path d="M1272 740h206v48h-206z" fill="#5bd14a"/><path d="M1320 735l20-38 22 38z" fill="#179b4a"/><path d="M1370 740l24-46 24 46z" fill="#169d47"/></g>
  </g>
