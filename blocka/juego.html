<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blocka</title>
    <link rel="stylesheet" href="blocka.css">
</head>
<body>
    <main id="menu" class="pantalla">
        <h1 class="titulo">BLOCKA</h1>
        <p class="subtitulo">Sorteá la imagen con la que vas a jugar</p>

        <div id="galeria" class="galeria"></div>

        <button type="button" id="btnAzar" class="boton">Elegir al azar</button>

        <!-- Panel que se abre encima de la galería cuando termina el sorteo -->
        <div id="config" class="fondo-panel oculto">
            <div class="panel-dif">
                <button type="button" id="btnCerrar" class="cerrar" aria-label="Cerrar">✕</button>
                <img id="previa" class="previa" src="" alt="Imagen elegida">
                <p class="subtitulo">Elegí la dificultad</p>
                <div class="acciones">
                    <button type="button" class="boton boton--dif" data-dif="facil">Fácil</button>
                    <button type="button" class="boton boton--dif" data-dif="medio">Medio</button>
                    <button type="button" class="boton boton--dif" data-dif="dificil">Difícil</button>
                </div>
                <button type="button" id="btnComenzar" class="boton" disabled>Comenzar</button>
            </div>
        </div>
    </main>
    <section id="juego">
        <p id="tiempo" class="oculto">00:00</p>
        <canvas class="oculto" id="canva" width="500" height="500"></canvas>
        <button type="button" id="btnAyuda" class="boton boton--ayuda oculto"
            title="Corrige una pieza. Una vez por nivel, suma 5 segundos.">
            Ayudita (+5 s)
        </button>
        <div id="finNivel" class="tarjeta oculto">
            <p id="mensajeFin"></p>
            <p id="recordFin"></p>
            <div class="acciones">
                <button id="btnSiguiente" class="boton">Siguiente nivel</button>
                <button id="btnReintentar" class="boton">Reintentar nivel</button>
                <button id="btnMenu" class="boton">Menú</button>
            </div>
        </div>
    </section>
    
    <script type="module" src="blocka.js"></script>
</body>
</html>
